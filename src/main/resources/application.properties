spring.application.name=dsfinal

# 讀取專案根目錄的 .env（裡面放 API key，見 .env.example）
spring.config.import=optional:file:.env[.properties]

# ===== 搜尋來源（provider 套件）=====
# 有設定 key 的來源才會啟用，可以同時開好幾個
serpapi.key=${SERPAPI_KEY:}
brave.key=${BRAVE_API_KEY:}
# 強制附加在每次查詢前面／後面的字（所有身份都會加；各身份自己的前後綴寫在 profiles.json）
search.query-prefix=
search.query-suffix=
# 每個來源抓幾筆
search.results-per-provider=10

# ===== 計分算法（scoring 套件）=====
# my = MyScorer（Goo狗 評分公式），default = DefaultScorer（原本的簡單算法）
search.scorer=my

# ===== Goo狗 評分公式參數（MyScorer）=====
# 身份（寵物主人、生物知識…）和各自的關鍵字權重寫在 src/main/resources/profiles.json
# T_min：內文字數下限，避免短網頁分數暴衝
scoring.t-min=200
# C：單一關鍵字最多加或扣幾分
scoring.c=3
# L_max：連結分數上限
scoring.l-max=2
# 查詢裡用 -詞 排除時，那個詞的權重
scoring.not-weight=-3
