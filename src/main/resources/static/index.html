<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <div class="lang-picker">
      <label for="lang" data-i18n="languageLabel">語言</label>
      <select id="lang"></select>
    </div>
    <h1 data-i18n="pageTitle">Goo狗 Search</h1>
    <form id="search-form">
      <input type="search" id="q" name="q" data-i18n-placeholder="searchPlaceholder" placeholder="輸入關鍵字…" autocomplete="off" autofocus>
      <button type="submit" data-i18n="searchButton">搜尋</button>
    </form>
    <div id="profiles" class="profiles" role="radiogroup" data-i18n-aria-label="profilesLabel" aria-label="搜尋身份"></div>
    <div id="profile-desc" class="profile-desc"></div>
    <div class="scorer-picker">
      <label for="scorer" data-i18n="scorerLabel">計分算法</label>
      <select id="scorer"></select>
      <span id="scorer-desc" class="scorer-desc"></span>
    </div>
    <div id="status"></div>
    <div id="results"></div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
