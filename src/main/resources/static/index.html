<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h1>Goo狗 Search</h1>
    <form id="search-form">
      <input type="search" id="q" name="q" placeholder="輸入關鍵字…" autocomplete="off" autofocus>
      <button type="submit">搜尋</button>
    </form>
    <div id="profiles" class="profiles" role="radiogroup" aria-label="搜尋身份"></div>
    <div id="profile-desc" class="profile-desc"></div>
    <div id="status"></div>
    <div id="results"></div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
